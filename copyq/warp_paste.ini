[Command1]
Name=Warp-aware paste
Enable=true
Automatic=false
Shortcut=return
HideWindow=false
Script=var cls = str(currentWindowClass());\nif (/dev\\.warp\\.Warp/.test(cls)) {\n    hide();\n    execute('bash', '-c', 'sleep 0.2 && ydotool key 29:1 42:1 47:1 47:0 42:0 29:0');\n} else {\n    paste();\n}
